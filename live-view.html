<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماشای زنده مرورگر — ربات جستجوی دیوار</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root { --primary: #a62626; --bg: #0f1115; --panel: #161a20; --border: #2a2f38; --text: #e8e8e8; --muted: #8b93a3; --green: #2e7d32; --blue: #1976d2; --red: #c62828; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top bar */
        .topbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; align-items: center; gap: 12px; z-index: 10; }
        .app-title { font-size: 0.85rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
        .app-title span { color: var(--primary); }
        .status-chip { background: #fffbe6; color: #7a5c00; font-size: 0.7rem; padding: 3px 10px; border-radius: 12px; font-weight: 700; }
        .status-chip.connected { background: #e8f5e9; color: var(--green); }
        .status-chip.waiting { background: #fff3e0; color: #b26a00; }
        .status-chip.error { background: #ffebee; color: var(--red); }

        /* Layout: browser on left, activity log on right */
        .main { flex-grow: 1; display: flex; gap: 10px; padding: 10px; min-height: 0; }
        .browser-col { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
        .log-col { width: 300px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
        
        /* Browser frame */
        .browser-frame { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; flex-grow: 1; }
        .toolbar { background: #1c2128; padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .dot.red { background: #ff5f57; } .dot.yellow { background: #febc2e; } .dot.green { background: #28c840; }
        .url-bar { flex-grow: 1; background: #262c35; border: none; border-radius: 8px; padding: 5px 12px; font-size: 0.75rem; color: #ccc; text-align: left; direction: ltr; min-width: 0; }
        .live-badge { background: var(--red); color: #fff; font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; animation: pulse 1.5s infinite; white-space: nowrap; }
        .viewport { position: relative; flex-grow: 1; background: #111; display: flex; align-items: flex-start; justify-content: center; overflow: auto; }
        .viewport img { max-width: 100%; max-height: 100%; display: none; box-shadow: 0 0 0 1px var(--border); }
        .viewport img.visible { display: block; animation: fadeIn 0.2s; }
        .empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 10px; }
        .empty-state .icon { font-size: 3rem; }
        .empty-state .hint { font-size: 0.8rem; max-width: 280px; text-align: center; line-height: 1.8; }
        .shot-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; font-size: 0.75rem; padding: 4px 12px; border-radius: 12px; z-index: 5; }

        /* Current task bar */
        .current-task { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; min-height: 44px; }
        .task-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
        .task-dot.running { background: var(--blue); animation: pulse 1s infinite; }
        .task-dot.done { background: var(--green); }
        .task-dot.error { background: var(--red); }
        .task-text { font-size: 0.85rem; flex-grow: 1; }
        .task-progress { width: 130px; height: 6px; background: #262c35; border-radius: 3px; overflow: hidden; }
        .task-progress-bar { height: 100%; width: 0%; background: var(--blue); border-radius: 3px; transition: width 0.3s; }

        /* Activity log */
        .log-header { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.75rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
        .log-clear { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 0.65rem; padding: 2px 8px; border-radius: 8px; cursor: pointer; font-family: inherit; }
        .log-clear:hover { color: #fff; border-color: var(--muted); }
        .log-list { flex-grow: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .log-entry { font-size: 0.7rem; padding: 6px 8px; border-radius: 6px; background: #1c2128; color: var(--muted); direction: ltr; text-align: left; word-break: break-all; line-height: 1.5; }
        .log-entry .t { color: #55606f; font-size: 0.6rem; }
        .log-entry.url { border-right: 3px solid var(--blue); }
        .log-entry.ads { border-right: 3px solid var(--green); }
        .log-entry.action { border-right: 3px solid var(--primary); color: var(--text); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        @media (max-width: 900px) {
            .main { flex-direction: column; }
            .log-col { width: 100%; height: 200px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="app-title">تماشای زنده <span>ربات جستجوی دیوار</span></div>
        <div id="statusChip" class="status-chip waiting">⏳ در حال اتصال...</div>
        <div style="flex-grow:1"></div>
        <div style="font-size:0.7rem;color:var(--muted);" id="adCounter">0 آگهی</div>
    </div>

    <div class="main">
        <!-- Browser column -->
        <div class="browser-col">
            <div class="browser-frame">
                <div class="toolbar">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                    <input class="url-bar" id="urlBar" value="divar.ir" readonly>
                    <span class="live-badge">LIVE</span>
                </div>
                <div class="viewport" id="viewport">
                    <div class="empty-state" id="emptyState">
                        <div class="icon">🖥️</div>
                        <div class="hint">منتظریم ربات به دیوار برود...<br>
                        از صفحه چت یک سوال بپرس تا زنده ببینی<br>چطور دیوار را جستجو و اسکرول میکند.</div>
                        <div style="font-size:0.7rem;color:#55606f;">ws://localhost:8080</div>
                    </div>
                    <div class="shot-label" id="shotLabel" style="display:none;"></div>
                    <img id="liveShot" alt="Live view">
                </div>
            </div>

            <!-- Current action bar -->
            <div class="current-task">
                <div class="task-dot" id="taskDot"></div>
                <div class="task-text" id="taskText">-</div>
                <div class="task-progress"><div class="task-progress-bar" id="taskBar"></div></div>
            </div>
        </div>

        <!-- Activity log -->
        <div class="log-col">
            <div class="log-header">
                <span>📋 لاگ فعالیت</span>
                <button class="log-clear" onclick="clearLog()">پاک کردن</button>
            </div>
            <div class="log-list" id="logList"></div>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://localhost:8080');
        const urlBar = document.getElementById('urlBar');
        const liveShot = document.getElementById('liveShot');
        const shotLabel = document.getElementById('shotLabel');
        const emptyState = document.getElementById('emptyState');
        const taskText = document.getElementById('taskText');
        const taskDot = document.getElementById('taskDot');
        const taskBar = document.getElementById('taskBar');
        const statusChip = document.getElementById('statusChip');
        const adCounter = document.getElementById('adCounter');
        const logList = document.getElementById('logList');
        const viewport = document.getElementById('viewport');

        const stepNames = {
            ai: '🧠 تحلیل درخواست',
            browser: '🌐 اجرای مرورگر',
            navigate: '🔗 باز کردن صفحه',
            scroll: '📜 اسکرول دیوار',
            extract: '🔎 استخراج آگهی',
            monitor: '👁️ مانیتورینگ',
        };
        let lastUrl = '';
        let adCount = 0;

        ws.onopen = () => {
            statusChip.textContent = '🟢 متصل';
            statusChip.className = 'status-chip connected';
            setTask('انتظار برای اولین جستجو...', 'waiting');
        };

        ws.onclose = () => {
            statusChip.textContent = '🔴 قطع شد';
            statusChip.className = 'status-chip error';
            setTask('اتصال قطع شد — سرور را چک کنید', 'error');
        };

        ws.onerror = () => {
            statusChip.textContent = '❌ خطا در اتصال';
            statusChip.className = 'status-chip error';
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            if (msg.type === 'screenshot') {
                showScreenshot(msg);
            } else if (msg.type === 'status') {
                handleStatus(msg);
            } else if (msg.type === 'log') {
                addLog(msg.kind === 'url' ? 'url' : msg.kind === 'ads' ? 'ads' : 'action', msg.text);
            } else if (msg.type === 'ad-count') {
                adCount = msg.count;
                adCounter.textContent = adCount + ' آگهی';
            }
        };

        function showScreenshot(msg) {
            if (!msg.image) return;
            emptyState.style.display = 'none';
            liveShot.src = 'data:image/jpeg;base64,' + msg.image;
            liveShot.classList.add('visible');

            // Update URL bar
            if (msg.url && msg.url !== lastUrl) {
                lastUrl = msg.url;
                urlBar.value = msg.url;
                addLog('url', '🌐 ' + msg.url);
            }

            // Update label
            if (msg.label) {
                shotLabel.style.display = 'block';
                shotLabel.textContent = '🌐 ' + msg.label;
            }

            // Update ad counter from scroll status message
            if (msg.label && msg.label.includes('اسکرول')) {
                adCount = parseInt((msg.label.match(/(\d+)/) || [0, adCount])[1]);
                adCounter.textContent = adCount + ' آگهی';
            }

            // Auto-scroll viewport if image is tall
            viewport.scrollTop = 0;
        }

        function handleStatus(s) {
            setTask(stepNames[s.step] + ' — ' + s.message, s.status);

            if (s.progress !== null && s.progress !== undefined) {
                taskBar.style.width = s.progress + '%';
            }

            if (s.step === 'monitor') {
                if (s.status === 'running' || s.status === 'info') {
                    addLog('action', '👁️ مانیتورینگ: ' + s.message);
                }
            } else if (s.status === 'done') {
                addLog('action', '✅ ' + s.message);
            } else if (s.status === 'error') {
                addLog('action', '❌ ' + s.message);
            }

            if (s.step === 'extract' && s.status === 'done') {
                let count = parseInt((s.message.match(/(\d+)/) || [0, adCount])[1]);
                adCount = count;
                adCounter.textContent = adCount + ' آگهی';
                addLog('ads', '🏠 ' + s.message);
            }
        }

        function setTask(text, state) {
            taskText.textContent = text;
            taskDot.className = 'task-dot ' + (state === 'running' ? 'running' : state === 'error' ? 'error' : 'done');
        }

        function addLog(type, text) {
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            const time = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            entry.innerHTML = `<span class="t">${time} |</span> ${text}`;
            logList.appendChild(entry);
            logList.scrollTop = logList.scrollHeight;
        }

        function clearLog() {
            logList.innerHTML = '';
        }
    </script>
</body>
</html>
